<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontrá y comprá todo lo ultimo en tecnologia.">
    <meta name="keywords" content="tecnologia, computacion, compra online, neuquen, monitores, celulares">
    <title>NQ-TEC | Registrate como usuario para hacer tu pedido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel='icon' href='../img/favicon.ico' type='image/x-icon' sizes="16x16" />
    
</head>
<body>
    <div class="container-fluid">
        <header class="row">
            <logo class="col">
                <p class="empresa center">N-TEC_</p>
                <p class="frase">Tu tienda de tecnologia</p>
            </logo>
        </header>
        <nav class="row">
            <div class="col m-0 p-0">
                <nav class="navbar navbar-nav navbar-expand-lg ">
                    <div class="container-fluid">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse m-1 p-1 " id="navbarSupportedContent">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0 nav-ul mx-auto justify-content-center">
                                <li class="nav-item ">
                                    <a class="nav-link" aria-current="page" href="../index.html">INICIO</a>
                                </li>
                                <li class="nav-item ">
                                    <a class="nav-link" aria-current="page" href="../index.html">ENTRAR</a>
                                </li>
                            </ul>
                        </div>
                        <!--<span class="navbar-text float-end carrito">
                            <a href="#" >CARRITO</a> <ion-icon name="cart"></ion-icon>
                        </span> -->
                    </div>
                </nav>
            </div>
        </nav>
        <main class="container text-center">
            <div class="row">
                <div class="col m-2">
                    <h1>Unetenos para poder comprar todo lo ultimo en tecnologia.</h1>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="card m-3 rounded-0 text-white bg-secondary">
                        <div class="card-header">
                            Completa el formulario para registrarte
                        </div>
                        <div class="card-body">
                            <form action="#" id="formRegistrarse">
                                <div class="row m-2">
                                    <div class="col">
                                        <label for="nombre" class="form-label">Apellido y nombre</label>
                                        <input type="text" class="form-control rounded-0"
                                            placeholder="Ej: Perez Juan" id="nombre" aria-label="nombre" required>
                                    </div>
                                </div>
                                <div class="row m-2">
                                    <div class="col">
                                        <label for="email" class="form-label">Dirección de email</label>
                                        <input type="email" class="form-control rounded-0"
                                            placeholder="Ej: juanperez@dominio.com" id="email" aria-label="email" required>
                                    </div>
                                </div>
                                <div class="row m-2">
                                    <div class="col">
                                        <label for="pass" class="form-label">Contraseña</label>
                                        <input type="password" class="form-control rounded-0" placeholder=""
                                            id="pass" aria-label="pass" required >
                                    </div>
                                    <div class="col">
                                        <label for="pass2" class="form-label">Repretir contraseña</label>
                                        <input type="password" class="form-control rounded-0" placeholder=""
                                            id="pass2" aria-label="pass2" required >
                                    </div>
                                </div>
                                <div class="row m-2 ">
                                    <div class="col col-md-3 col-xs-12 col-sm-12">
                                        <button type="submit"
                                            class="btn enviarForm btn-dark rounded-0 w-100 mt-2">Registrarme</button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer>
            <div class="row">
                <div class="col text-center footer p-2">
                    <address>
                        <p><ion-icon name="logo-whatsapp"></ion-icon> +54 299 123456</p>
                        <p><ion-icon name="call-outline"></ion-icon> +54 299 4456789 </p>
                        <p><ion-icon name="mail-outline"></ion-icon> shop@n-tec.com</p>
                    </address>
                </div>
            </div>
            <div class="row derechos">
                <div class="col text-center  p-1">
                    <small>Copyright La Verdad 2024 - Todos los derechos reservados.</small>
                </div>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <!--<script src="./js/login.js"></script>
    <script src="./js/main.js"></script>-->
</body>
</html>
