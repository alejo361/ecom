<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Encontrá y comprá todo lo ultimo en tecnologia.">
    <meta name="keywords" content="tecnologia, computacion, compra online, neuquen, monitores, celulares">
    <title>N-TEC | Administrador - Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../css/estilos.css">
    <link rel='icon' href='../img/favicon.ico' type='image/x-icon' sizes="16x16" />

</head>

<body>
    <div class="container-fluid">
        <header class="row">
            <logo class="col">
                <p class="empresa center">N-TEC_</p>
                <p class="frase">Tu tienda de tecnologia</p>
            </logo>
        </header>
        <nav class="row ">
            <div class="col m-0 p-0">
                <nav class="navbar navbar-nav navbar-expand-lg">
                    <div class="container-fluid">
                        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                            data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                            aria-expanded="false" aria-label="Toggle navigation">
                            <span class="navbar-toggler-icon"></span>
                        </button>
                        <div class="collapse navbar-collapse m-1 p-1 " id="navbarSupportedContent">
                            <ul class="navbar-nav me-auto mb-2 mb-lg-0 nav-ul mx-auto justify-content-center">
                                <li class="nav-item ">
                                    <a class="nav-link" aria-current="page" href="../index.html">INICIO</a>
                                </li>
                                <li class="nav-item">
                                    <a class="nav-link" aria-current="page" href="#" id="logout">SALIR</a>
                                </li>
                            </ul>
                        </div>
                    </div>
                </nav>
            </div>
        </nav>
        <main class="container">
            <div class="row">
                <div class="col col-lg-8 p-2 m-auto mt-4 mb-4 textoContacto">
                    <h1 class="fs-3 text-center">Bienvenido Administrador</h1>
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <a href="./admin.html" class="btn btn-dark rounded-0  mb-3">Productos</a>
                    <a href="#" class="btn btn-success rounded-0  mb-3">Ver Pedidos</a>
                </div>
            </div>
            <div class="row">
                <div class="col">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <div class="card m-2 rounded-0">
                        <div class="card-header">
                            LISTADO DE PEDIDOS
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col">
                                    <div class="col col-md-12 col-xs-12 col-sm-12 ">
                                        <div class="input-group mb-3">
                                            <input type="text" class="form-control rounded-0"
                                                placeholder="Buscar por nombre o apellido" aria-label="Busqueda"
                                                aria-describedby="boton-buscar" id="textBusqueda">
                                            <button class="btn btn-secondary rounded-0" type="button"
                                                id="btnBuscarPed"><ion-icon name="search"></ion-icon></button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col">
                                    <span>Cantidad de pedidos: <span id="cant-ped">0</span></span>
                                </div>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-striped table-hover table-responsive" id="tabla-pedidos">
                                    <thead class="table-dark">
                                        <tr>
                                            <th data-campo="id">Id <i class="fas fa-sort"></i></th>
                                            <th data-campo="nombre">Nombre <i class="fas fa-sort"></i></th>
                                            <th data-campo="apellido">Apellido <i class="fas fa-sort"></i></th>
                                            <th data-campo="estado">Estado <i class="fas fa-sort"></i></th>
                                            <th data-campo="total">Total <i class="fas fa-sort"></i></th>
                                            <th data-campo="no">Acciones</th>
                                        </tr>
                                    </thead>
                                    <template id="fila-pedido">
                                        <tr>
                                            <td id="tdid"></td>
                                            <td id="tdnombre"></td>
                                            <td id="tdapellido"></td>
                                            <td id="tdestado"></td>
                                            <td id="tdtotal"></td>
                                            <td id="tdacciones">
                                                <button data-bs-toggle="modal" data-bs-target="#verModal"
                                                    data-bs-whatever=""
                                                    class="btn btn-primary btn-detalle rounded-0">Ver Detalle</button>
                                                <button class="btn btn-danger btn-eliminar rounded-0">Eliminar</button>
                                            </td>
                                        </tr>
                                    </template>
                                    <tbody>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal fade" id="verModal" tabindex="-1" aria-labelledby="verModalLabel" aria-hidden="true">
                <div class="modal-dialog modal-fullscreen"><!--modal-dialog-scrollable">-->
                    <div class="modal-content bg-secondary">
                        <form id="verFormModal" class="bg-secondary">
                            <div class="modal-header bg-secondary">
                                <h1 class="modal-title fs-5" id="verModalLabel" id="modalVerTitulo">Pedido</h1>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                    aria-label="Close"></button>
                            </div>
                            <div class="modal-body bg-secondary">
                                <div class="row m-2">
                                    <div class="col">
                                        <table class="table table-striped">
                                            <thead>
                                                <tr class="table-dark">
                                                    <th scope="col">Id</th>
                                                    <th scope="col">Producto</th>
                                                    <th scope="col">Cantidad</th>
                                                    <th scope="col">Precio</th>
                                                </tr>
                                            </thead>
                                            <tbody id="bodyModalPedidos">

                                            </tbody>
                                            <tfoot>
                                                <tr class="table-success">
                                                    <td colspan="3" class="text-end">Total</td>
                                                    <td><span id="totalMdPedido"></span></td>
                                                </tr>
                                            </tfoot>
                                        </table>
                                    </div>
                                </div>
                                <div class="row m-2">
                                    <div class="col">
                                        <input type="hidden" class="form-control" placeholder="1" id="mdCodigo"
                                            autofocus aria-label="codigo">
                                        <label for="mdEstado" class="form-label">Estado</label>
                                        <select class="form-select" id="mdEstado" required>
                                        </select>
                                    </div>
                                </div>

                            </div>
                            <div class="modal-footer bg-secondary">
                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal"
                                    id="closeMdVer">Cerrar</button>
                                <button type="button" class="btn btn-dark" id="btnMdSave">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
        <footer class="mt-3">
            <div class="row derechos">
                <div class="col text-center  p-1">
                    <small>Copyright N-TEC 2024 - Todos los derechos reservados.</small>
                </div>
            </div>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <script src="../js/login.js"></script>
    <script src="../js/producto.js"></script>
    <script src="../js/productos.js"></script>
    <script src="../js/pedidos.js"></script>
    <script src="../js/adminpedidos.js"></script>
</body>

</html>
